name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  LANG: C.UTF-8  # имена файлов с кириллицей при скачивании в Chromium

jobs:
  backend:
    name: Бэкенд — линтер и тесты
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: birge
          POSTGRES_PASSWORD: birge
          POSTGRES_DB: birge_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U birge" --health-interval 2s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - name: Тесты (юнит, интеграционные на PostgreSQL, API и WebSocket)
        run: pytest --cov=app --cov-report=term --cov-fail-under=90

  frontend:
    name: Фронтенд — типы, линтер, тесты, сборка
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Контракт API не разошёлся с бэкендом
        run: npm run api:types && git diff --exit-code src/api/schema.d.ts
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm run test:coverage
      - run: npm run build

  e2e:
    name: E2E — два браузера против настоящего API
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: birge
          POSTGRES_PASSWORD: birge
          POSTGRES_DB: birge
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U birge" --health-interval 2s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://birge:birge@localhost:5432/birge
      JWT_SECRET: ci-secret-that-is-long-enough-32-bytes
      API_URL: http://localhost:8000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Запуск API с обработчиком фоновых задач
        working-directory: backend
        run: |
          pip install -r requirements.txt
          alembic upgrade head
          nohup uvicorn app.main:app --port 8000 > api.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:8000/health && break; sleep 1; done
      - name: Сравнение схемы API с работающим сервером
        working-directory: frontend
        run: |
          npm ci
          curl -sf http://localhost:8000/openapi.json -o /tmp/live.json
          npx openapi-typescript /tmp/live.json -o /tmp/live.d.ts --default-non-nullable false
          diff /tmp/live.d.ts src/api/schema.d.ts
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:e2e
        working-directory: frontend
      - name: Лог API при падении
        if: failure()
        run: cat backend/api.log
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7

  docker:
    name: Docker-образ — сборка и смоук
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up --build --wait
      - name: Смоук — здоровье, демо-вход, доска
        run: |
          curl -sf http://localhost:8000/health
          TOKEN=$(curl -sf http://localhost:8000/auth/login -H 'content-type: application/json' \
            -d '{"email":"aliya@birge.kz","password":"birge-demo"}' | python3 -c "import sys,json;print(json.load(sys.stdin)['access_token'])")
          curl -sf http://localhost:8000/boards -H "Authorization: Bearer $TOKEN" | grep -q "Запуск Бірге"
      - if: failure()
        run: docker compose logs
