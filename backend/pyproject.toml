[project]
name = "birge-api"
version = "1.0.0"
description = "Бэкенд доски задач «Бірге»: FastAPI, PostgreSQL, WebSocket, очередь фоновых задач"
requires-python = ">=3.12"

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "ASYNC"]
ignore = ["B008"]  # Depends() в аргументах — штатный приём FastAPI

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S107", "S311"]
"app/config.py" = ["S105"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "unit: чистая логика без БД и сети",
    "integration: сервисы, очередь и события на настоящем PostgreSQL",
    "api: HTTP и WebSocket-запросы к приложению целиком",
]
filterwarnings = ["error::pytest.PytestUnraisableExceptionWarning"]

[tool.coverage.run]
source = ["app"]
# SQLAlchemy async выполняет код в greenlet, TestClient — в отдельном потоке: без этого покрытие занижено
concurrency = ["greenlet", "thread"]
omit = ["app/seed.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true
