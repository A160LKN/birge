# Blueprint для Render: Dashboard → New → Blueprint → этот репозиторий.
# База — внешняя (Neon): бесплатная база Render удаляется через 30 дней.
services:
  - type: web
    name: birge-api
    runtime: docker
    plan: free
    region: frankfurt
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        sync: false            # адрес базы из Neon
      - key: CORS_ORIGINS
        sync: false            # адрес фронтенда на Vercel
      - key: JWT_SECRET
        generateValue: true
      - key: DB_POOL_SIZE
        value: "5"
      - key: DB_MAX_OVERFLOW
        value: "5"
