# Blueprint для Render: Dashboard → New → Blueprint → этот репозиторий.
# База — внешняя (Neon): бесплатная база Render удаляется через 30 дней.
services:
  - type: web
    name: birge-api
    runtime: docker
    plan: free
    region: frankfurt
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        sync: false            # адрес базы из Neon
      - key: CORS_ORIGINS
        sync: false            # адрес фронтенда на Vercel
      # Живой сайт: секреты по умолчанию запрещены, без JWT_SECRET сервер не стартует
      - key: ENVIRONMENT
        value: production
      - key: JWT_SECRET
        generateValue: true
      # Адрес клиента для лимитов входа и регистрации (см. app/ratelimit.py:client_ip).
      # Render стоит за Cloudflare: True-Client-IP выставляет Cloudflare, X-Forwarded-For — «…, клиент, Cloudflare»
      - key: CLIENT_IP_HEADER
        value: true-client-ip
      - key: TRUST_PROXY
        value: "true"
      - key: PROXY_HOPS
        value: "2"
      - key: DB_POOL_SIZE
        value: "5"
      - key: DB_MAX_OVERFLOW
        value: "5"
